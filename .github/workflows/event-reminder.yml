name: event-reminder

# תזכורת פוש שעה לפני האירוע הגדול. ה-cron של GitHub יכול להתעכב שעות, ולכן יש כמה ריצות מוקדם בבוקר
# ביום האירוע; כל אחת ממתינה בתוך הג'וב עד הרגע המדויק ושולחת, ורק הראשונה שמצליחה לסמן שלחה
# (ר' scripts/notify-event-reminder.mjs). לאירוע הבא: לעדכן EVENT_START_ISO, הטקסט, ואת התאריך בשורות ה-cron
# (דקה שעה יום חודש, ב-UTC; ריצה מוקדמת ממש הולכת לישון עד 5.5 שעות, ואם עוד לא הגיע הזמן היא מוותרת)
on:
  schedule:
    - cron: '47 12 25 9 *'
    - cron: '17 13 25 9 *'
    - cron: '47 13 25 9 *'
    - cron: '17 14 25 9 *'
    - cron: '47 14 25 9 *'
    - cron: '17 15 25 9 *'
    - cron: '47 15 25 9 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scheduled = wait until planned time and send | dry = print the plan only | test = push only to one user | now = send to everyone immediately'
        type: choice
        options: [scheduled, dry, test, now]
        default: dry
      test_nickname:
        description: 'Limit recipients to this nickname (mode=test, or a full scheduled test run) and mark the push as a test'
        type: string
        default: ''
      event_start_iso:
        description: 'Testing only: override the event start (ISO, e.g. 2026-09-20T18:55:00Z)'
        type: string
        default: ''
      lead_minutes:
        description: 'Testing only: override how many minutes before the start to send'
        type: string
        default: ''

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/notify-event-reminder.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ inputs.mode || 'scheduled' }}
          TEST_NICKNAME: ${{ inputs.test_nickname }}
          EVENT_START_ISO: ${{ inputs.event_start_iso || '2026-09-25T18:00:00Z' }}
          LEAD_MINUTES: ${{ inputs.lead_minutes || '60' }}
          REMINDER_TITLE: '🍋🌴🌿🛖 האירוע הגדול של סוכות הערב ב-21:00!'
          REMINDER_BODY: 'חג סוכות שמח! אתרוג, לולב, הדס וערבה 🍋🌴🌿 חדר ההמתנה נפתח ב-20:55 — כולם משחקים יחד באותה מילה.'
