name: notify-new-word

on:
  schedule:
    # רץ כל שעה — נדרש כי GitHub Actions cron יכול להתעכב שעות שלמות (לא רק דקות),
    # והסקריפט בעצמו בודק אם אנחנו בטווח הקבלה המורחב סביב 10:00/22:00 שעון ישראל
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send immediately (skip hour check)'
        type: boolean
        default: false
      window_override:
        description: 'Simulate a specific windowId (e.g. a Sunday 10:00 window, for testing the weekly-champion logic)'
        type: string
        default: ''
      dry_run:
        description: 'Compute the message but do not actually send it'
        type: boolean
        default: false

concurrency:
  group: new-word

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/notify-new-word.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force == true && '1' || '0' }}
          WINDOW_OVERRIDE: ${{ inputs.window_override }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
