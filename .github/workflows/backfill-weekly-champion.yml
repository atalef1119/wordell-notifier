name: backfill-weekly-champion

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: 'weekStartWindowId of the week AFTER the one to backfill (e.g. thisWeekStart)'
        required: true
      write:
        description: 'Set to 1 to actually write, otherwise dry-run'
        required: false
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/backfill-weekly-champion.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEEK_START: ${{ inputs.week_start }}
          WRITE: ${{ inputs.write }}
