name: check-winners

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      window_override:
        description: 'Check a specific windowId (for testing)'
        required: false

concurrency:
  group: check-winners
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-winners.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WINDOW_OVERRIDE: ${{ inputs.window_override }}
      # commit ריק פעם בחודש כדי שה-cron לא יכובה אחרי 60 יום ללא פעילות
      - name: Monthly keepalive commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 10 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
