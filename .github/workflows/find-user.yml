name: find-user

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Nickname substring to search for (case-insensitive)'
        type: string
        required: true

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/find-user.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_QUERY: ${{ inputs.query }}
